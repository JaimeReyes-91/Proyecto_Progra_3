<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Ticket | Sistema de Tickets</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tickets.css">
</head>

<body>
    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <strong class="brand-text">Tickets</strong>
                <button class="toggle-btn" id="toggleSidebar">☰</button>
            </div>
            <nav>
                <a class="nav-link" href="dashboardSolicitante.html" id="linkDashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a class="nav-link active" href="ticketsSolicitante.html">
                    <span class="nav-icon">🎫</span>
                    <span class="nav-text">Tickets</span>
                </a>
                <a class="nav-link" href="#" id="logoutLink">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Salir</span>
                </a>
            </nav>
        </aside>

        <!-- CONTENIDO -->
        <main class="main">

            <!-- HEADER -->
            <header class="topbar">
                <div>
                    <h1>Nuevo ticket</h1>
                    <p>Describe tu problema y el equipo de soporte lo atenderá.</p>
                </div>
                
                <div class="user-chip">
                <div class="avatar" id="usuarioAvatar"></div>
                <div class="info">
                    <div class="nombre" id="usuarioNombre">
                    </div>
                    <div class="rol" id="usuarioRol">
                    </div>
                </div>
            </div>
            
            </header>

            <!-- SOLO EL FORMULARIO CENTRADO -->
            <section class="grid one">
                <article class="card" id="cardFormulario">

                    <div class="card-header">
                        <div>
                            <h2>Crear solicitud</h2>
                            <p>Completa los campos para registrar un nuevo ticket de soporte.</p>
                        </div>
                    </div>

                    <form id="ticketForm" class="form-grid">

                        <div class="field">
                            <label for="descripcion">Descripción</label>
                            <textarea
                                id="descripcion"
                                rows="6"
                                required
                                placeholder="Describe detalladamente el problema..."
                            ></textarea>
                        </div>

                        <!-- Campo oculto para el solicitante -->
                        <div class="field" id="creadoPorField" style="display:none">
                            <label for="creadoPor">ID del solicitante</label>
                            <input type="number" id="creadoPor" min="1" readonly required>
                        </div>

                        <div class="field">
                            <label>Archivo adjunto</label>
                            <div class="file-input-wrap">
                                <button
                                    type="button"
                                    class="btn secondary small"
                                    onclick="document.getElementById('archivo').click()"
                                >
                                    📎 Elegir archivo
                                </button>
                                <span id="nombreArchivo">Ningún archivo seleccionado</span>
                                <input
                                    type="file"
                                    id="archivo"
                                    accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
                                    style="display:none"
                                >
                            </div>
                        </div>

                        <button class="btn" type="submit">Crear ticket</button>

                    </form>

                    <p id="mensaje" class="message"></p>

                </article>
            </section>

        </main>
    </div>

    <!-- MODAL TIMELINE -->
    <div id="modalTimeline" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitulo">Timeline</h2>
                <button class="modal-cerrar" type="button" onclick="cerrarModal()">✕</button>
            </div>
            <div id="modalContenido" class="timeline-lista"></div>
        </div>
    </div>

    <!-- MODAL OBSERVACION -->
    <div id="modalObservacion" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalObsTitulo">Observación</h2>
                <button class="modal-cerrar" type="button" onclick="cerrarModalObs()">✕</button>
            </div>
            <div class="form-grid">
                <div class="field">
                    <label for="inputObservacion">Observación</label>
                    <textarea id="inputObservacion" rows="5" placeholder="Escribe una observación..."></textarea>
                </div>
                <button class="btn" type="button" onclick="confirmarCambioEstado()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ticketsSolicitante.js"></script>
</body>
</html>
