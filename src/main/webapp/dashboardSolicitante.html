<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard | Sistema de Tickets</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <strong class="brand-text">Tickets</strong>
                <button class="toggle-btn" id="toggleSidebar">☰</button>
            </div>
            <nav>
                <a class="nav-link active" href="dashboardSolicitante.html">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a class="nav-link" href="tickets.html">
                    <span class="nav-icon">🎫</span>
                    <span class="nav-text">Tickets</span>
                </a>
                <a class="nav-link" href="#" id="logoutLink">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Salir</span>
                </a>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1>Mis tickets</h1>
                    <p>Resumen de tus solicitudes registradas.</p>
                </div>
                <div class="user-chip" id="usuarioActivo">
                    <div class="avatar" id="usuarioAvatar"></div>
                    <div class="info">
                        <div class="nombre" id="usuarioNombre"></div>
                        <div class="rol" id="usuarioRol"></div>
                    </div>
                </div>
            </header>

            <section class="grid kpis">
                <article class="kpi">
                    <div class="kpi-icon"><i class="fa-solid fa-ticket"></i></div>
                    <span>Total</span>
                    <strong id="totalTickets">0</strong>
                </article>
                <article class="kpi">
                    <div class="kpi-icon"><i class="fa-solid fa-circle-plus"></i></div>
                    <span>Creados</span>
                    <strong id="ticketsCreados">0</strong>
                </article>
                <article class="kpi">
                    <div class="kpi-icon"><i class="fa-solid fa-user-check"></i></div>
                    <span>Asignados</span>
                    <strong id="ticketsAsignados">0</strong>
                </article>
                <article class="kpi">
                    <div class="kpi-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                    <span>Validación</span>
                    <strong id="ticketsValidacion">0</strong>
                </article>
                <article class="kpi">
                    <div class="kpi-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <span>Cerrados</span>
                    <strong id="ticketsCerrados">0</strong>
                </article>
            </section>

            <section class="card">
                <div class="card-header">
                    <div>
                        <h2>Últimos tickets</h2>
                        <p>Tus solicitudes más recientes.</p>
                    </div>
                    <a class="btn secondary" href="tickets.html">Ver tickets</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaRecientes"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboardSolicitante.js"></script>
</body>
</html>
