<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tickets Soporte</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tickets.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->

    <aside class="sidebar"
           id="sidebar">

        <div class="brand">

            <strong class="brand-text">
                Tickets
            </strong>

            <button class="toggle-btn"
                    id="toggleSidebar">

                ☰

            </button>

        </div>

        <nav>

            <a class="nav-link"
               href="dashboardSoporte.html">

                <span class="nav-icon">🛠</span>
                <span class="nav-text">Dashboard</span>

            </a>

            <a class="nav-link active"
               href="ticketsSoporte.html">

                <span class="nav-icon">🎫</span>
                <span class="nav-text">Tickets</span>

            </a>

            <a class="nav-link"
               href="#"
               id="logoutLink">

                <span class="nav-icon">🚪</span>
                <span class="nav-text">Salir</span>

            </a>

        </nav>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div>

                <h1>Tickets de soporte</h1>

                <p>
                    Gestión operativa de tickets asignados.
                </p>

            </div>

            <div class="user-chip">

                <div class="avatar"
                     id="usuarioAvatar">

                </div>

                <div class="info">

                    <div class="nombre"
                         id="usuarioNombre">

                    </div>

                    <div class="rol"
                         id="usuarioRol">

                    </div>

                </div>

            </div>

        </header>

        <!-- FILTROS -->

        <section class="card">

            <div class="grid two">

                <div class="field">

                    <label for="filtroTexto">
                        Buscar
                    </label>

                    <input type="search"
                           id="filtroTexto"
                           placeholder="Código o descripción">

                </div>

                <div class="field">

                    <label for="filtroEstado">
                        Estado
                    </label>

                    <select id="filtroEstado">

                        <option value="">
                            Todos
                        </option>

                        <option value="CREADO">
                            Nuevos
                        </option>

                        <option value="ASIGNADO">
                            Asignados
                        </option>

                        <option value="VALIDACION">
                            Validación
                        </option>

                        <option value="DEVUELTO">
                            Devueltos
                        </option>

                    </select>

                </div>

            </div>

        </section>

        <!-- TABLA -->

        <section class="card">

            <div class="card-header">

                <div>

                    <h2>Listado de tickets</h2>

                    <p>
                        Tickets operativos del técnico.
                    </p>

                </div>

            </div>

            <p id="mensaje"
               class="message"></p>

            <div class="table-wrap">

                <table>

                    <thead>

                    <tr>

                        <th>Código</th>
                        <th>Estado</th>
                        <th>Descripción</th>
                        <th>Solicitante</th>
                        <th>Timeline</th>
                        <th>Archivo</th>
                        <th>Acciones</th>

                    </tr>

                    </thead>

                    <tbody id="tablaTickets"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- MODAL OBSERVACION -->

<div id="modalObservacion"
     class="modal-overlay">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalObsTitulo">
                Observación
            </h2>

            <button class="modal-cerrar"
                    onclick="cerrarModalObs()">

                ✕

            </button>

        </div>

        <div class="form-grid">

            <div class="field">

                <label for="inputObservacion">
                    Observación
                </label>

                <textarea id="inputObservacion"
                          rows="5"></textarea>

            </div>

            <button class="btn"
                    onclick="confirmarCambioEstado()">

                Confirmar

            </button>

        </div>

    </div>

</div>

<!-- MODAL TIMELINE -->

<div id="modalTimeline"
     class="modal-overlay">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitulo">
                Timeline
            </h2>

            <button class="modal-cerrar"
                    onclick="cerrarModal()">

                ✕

            </button>

        </div>

        <div id="modalContenido"
             class="timeline-lista">

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/ticketsSoporte.js"></script>

</body>
</html>
